  <style>
:root {
  color-scheme: dark;
  --cyan: #3fe9ff;
  --blue: #1d78ff;
  --violet: #a05bf5;
  --orange: #ff8f54;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #01040d; }
body { font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }

#bstvc-background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background: #01040d;
}

#scene {
  position: absolute;
  inset: -1.8%;
  transform-origin: center;
  will-change: transform;
}

#source-art,
#motion-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#motion-overlay {
  overflow: visible;
  pointer-events: none;
}

#source-art {
  user-select: none;
  -webkit-user-drag: none;
}

#spatial-grid,
#earth-texture,
#earth-sheen,
#relation-layer,
#time-layer,
#beta-field,
#star-field {
  transform-box: view-box;
}

#spatial-grid {
  transform-origin: 474px 691px;
  mix-blend-mode: screen;
}

#earth-texture {
  transform-origin: 474px 691px;
  will-change: transform;
}

#earth-sheen,
#relation-silhouette,
#relation-sweep,
#relation-return,
.moon-halo,
.moon-spark {
  mix-blend-mode: screen;
}

.beta-node {
  transform-box: fill-box;
  transform-origin: center;
  mix-blend-mode: screen;
  will-change: opacity, transform, filter;
}

#relation-sweep,
#time-axis {
  vector-effect: non-scaling-stroke;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background:
    linear-gradient(90deg, rgba(0, 3, 10, 0.14), transparent 34%, transparent 82%, rgba(0, 4, 13, 0.12)),
    linear-gradient(180deg, rgba(0, 2, 8, 0.08), transparent 68%, rgba(0, 2, 8, 0.20));
}

.controls {
  position: fixed;
  right: 22px;
  bottom: 20px;
  z-index: 20;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid rgba(100, 225, 255, 0.22);
  border-radius: 999px;
  background: rgba(2, 8, 20, 0.80);
  color: #dff8ff;
  backdrop-filter: blur(14px);
}

body.show-controls .controls { display: flex; }
.controls button {
  border: 0;
  border-radius: 999px;
  padding: 7px 12px;
  background: rgba(82, 211, 255, 0.14);
  color: inherit;
  cursor: pointer;
}
.controls input { width: 118px; accent-color: #45e2f0; }
.controls .name { max-width: 220px; font-size: 12px; opacity: 0.76; }

body.chromeless .controls { display: none !important; }

@media (max-width: 820px) {
  #scene { inset: -5%; }
  #source-art { object-position: 12% center; }
  .shade {
    background:
      linear-gradient(180deg, rgba(0, 3, 10, 0.05), transparent 52%, rgba(0, 2, 8, 0.58)),
      linear-gradient(90deg, rgba(0, 3, 10, 0.08), transparent 70%);
  }
}

@media (prefers-reduced-motion: reduce) {
  #scene { transform: none !important; }
  #relation-layer, #star-field, #beta-field, #time-layer { opacity: 0.18 !important; }
  #earth-texture { transform: none !important; }
}


/* 方案 A 终稿：地球保持输入图中的静止状态。 */
#earth-texture,
#earth-sheen,
#spatial-grid {
  display: none !important;
}
</style>

  <script>
(() => {
  "use strict";

  const CONFIG = {"slug":"方案A时空呼吸","name":"方案 A｜时空呼吸｜终稿","subtitle":"地球静止；深空 β 显隐增强；单文件便携交付","duration":18000,"particleCount":3,"gridOpacity":0.22,"sweepOpacity":0.3,"flowOutlineOpacity":0.22,"betaOpacity":0.38,"betaCycles":2,"earthArcDeg":3.2,"moonEnergy":0.46,"starEnergy":0.34,"cameraMode":"static","gridDirection":0,"code":"A_FINAL"};
  const TAU = Math.PI * 2;
  const params = new URLSearchParams(location.search);
  const seekTime = params.has("t") ? Number(params.get("t")) : null;
  const staticMode = params.has("static");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const scene = document.querySelector("#scene");
  const sourceArt = document.querySelector("#source-art");
  const overlay = document.querySelector("#motion-overlay");
  const starField = document.querySelector("#star-field");
  const earthTexture = document.querySelector("#earth-texture");
  const earthSheen = document.querySelector("#earth-sheen");
  const spatialGrid = document.querySelector("#spatial-grid");
  const relationPath = document.querySelector("#relation-path");
  const relationSilhouette = document.querySelector("#relation-silhouette");
  const relationSweep = document.querySelector("#relation-sweep");
  const relationReturn = document.querySelector("#relation-return");
  const particles = [...document.querySelectorAll(".relation-particle")];
  const timeAxis = document.querySelector("#time-axis");
  const moonActors = [...document.querySelectorAll(".moon-actor")];
  const moonGlows = [...document.querySelectorAll(".moon-glow")];
  const moonHalos = [...document.querySelectorAll(".moon-halo")];
  const moonSparks = [...document.querySelectorAll(".moon-spark")];
  const betaNodes = [...document.querySelectorAll(".beta-node")];
  const hotspotA = document.querySelector("#hotspot-a");
  const hotspotB = document.querySelector("#hotspot-b");
  const energyWave = document.querySelector("#energy-wave");

  const random = (() => {
    let seed = 20260727;
    return () => {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  })();

  const stars = Array.from({ length: 64 }, (_, index) => {
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", (24 + random() * 1624).toFixed(2));
    circle.setAttribute("cy", (24 + random() * 893).toFixed(2));
    circle.setAttribute("r", (0.55 + random() * 1.45).toFixed(2));
    circle.setAttribute("fill", index % 9 === 0 ? "#7defff" : "#ffffff");
    circle.dataset.phase = String(random());
    starField.appendChild(circle);
    return circle;
  });

  const pathLength = relationPath.getTotalLength();
  let playing = true;
  let playbackRate = 1;
  let startedAt = performance.now();
  let pausedElapsed = 0;
  let rafId = 0;

  function updateViewport() {
    const sourceWidth = 1672;
    const sourceHeight = 941;
    const viewportRatio = innerWidth / Math.max(1, innerHeight);
    const sourceRatio = sourceWidth / sourceHeight;
    if (viewportRatio < sourceRatio) {
      const visibleWidth = sourceHeight * viewportRatio;
      const focal = innerWidth <= 820 ? 0.12 : 0.5;
      const left = (sourceWidth - visibleWidth) * focal;
      overlay.setAttribute("viewBox", `${left.toFixed(3)} 0 ${visibleWidth.toFixed(3)} ${sourceHeight}`);
      sourceArt.style.objectPosition = `${(focal * 100).toFixed(1)}% center`;
    } else {
      const visibleHeight = sourceWidth / viewportRatio;
      const top = (sourceHeight - visibleHeight) * 0.5;
      overlay.setAttribute("viewBox", `0 ${top.toFixed(3)} ${sourceWidth} ${visibleHeight.toFixed(3)}`);
      sourceArt.style.objectPosition = "center";
    }
  }
  updateViewport();
  addEventListener("resize", updateViewport, { passive: true });

  const wrap01 = value => ((value % 1) + 1) % 1;
  const smoothPulse = distance => {
    const value = Math.max(0, 1 - distance);
    return value * value * (3 - 2 * value);
  };

  function renderAt(milliseconds) {
    const loopMs = ((milliseconds % CONFIG.duration) + CONFIG.duration) % CONFIG.duration;
    const p = loopMs / CONFIG.duration;
    const wave = Math.sin(TAU * p);
    const wave2 = Math.sin(TAU * (p + 0.25));
    const breathe = 0.5 - 0.5 * Math.cos(TAU * p);

    if (CONFIG.cameraMode === "static") {
      scene.style.transform = "none";
    } else if (CONFIG.cameraMode === "breathe") {
      scene.style.transform = `translate3d(${(2.2 * wave).toFixed(3)}px, ${(-1.8 * wave2).toFixed(3)}px, 0) scale(${(1 + 0.006 * breathe).toFixed(6)})`;
    } else if (CONFIG.cameraMode === "cinematic") {
      scene.style.transform = `translate3d(${(9 * wave).toFixed(3)}px, ${(-5 * wave2).toFixed(3)}px, 0) scale(${(1.006 + 0.022 * breathe).toFixed(6)})`;
    } else {
      scene.style.transform = `scale(${(1 + 0.003 * breathe).toFixed(6)})`;
    }

    stars.forEach((star, index) => {
      const phase = Number(star.dataset.phase);
      const pulse = 0.5 + 0.5 * Math.sin(TAU * (p * (index % 3 + 1) + phase));
      star.style.opacity = String(0.08 + CONFIG.starEnergy * pulse * pulse);
    });

    const earthAngle = CONFIG.earthArcDeg * wave;
    const gridLag = CONFIG.gridDirection * 7.5 * Math.sin(TAU * (p + 0.09));
    const gridAngle = earthAngle * 0.78 + gridLag;
    earthTexture.setAttribute("transform", `rotate(${earthAngle.toFixed(4)} 474 691)`);
    spatialGrid.setAttribute("transform", `rotate(${gridAngle.toFixed(4)} 474 691)`);
    spatialGrid.style.opacity = String(CONFIG.gridOpacity * (0.72 + 0.28 * breathe));
    earthSheen.setAttribute("transform", `translate(${(44 * wave2).toFixed(3)} 0) rotate(${(-0.36 * earthAngle).toFixed(3)} 474 691)`);
    earthSheen.style.opacity = String(0.10 + 0.22 * (0.5 + 0.5 * wave2));

    hotspotA.setAttribute("cx", (432 + 46 * Math.cos(TAU * p)).toFixed(3));
    hotspotA.setAttribute("cy", (628 + 32 * Math.sin(TAU * p)).toFixed(3));
    hotspotA.style.opacity = String(0.12 + 0.22 * breathe);
    hotspotB.setAttribute("cx", (544 + 40 * Math.cos(TAU * (p + 0.43))).toFixed(3));
    hotspotB.setAttribute("cy", (758 + 26 * Math.sin(TAU * (p + 0.43))).toFixed(3));
    hotspotB.style.opacity = String(0.10 + 0.18 * (1 - breathe));

    relationSilhouette.style.opacity = String(CONFIG.flowOutlineOpacity * (0.68 + 0.32 * breathe));
    relationSweep.style.strokeDashoffset = String(1 - p);
    relationSweep.style.opacity = String(CONFIG.sweepOpacity * (0.62 + 0.38 * Math.sin(Math.PI * breathe)));
    relationReturn.style.strokeDashoffset = String(0.5 - 2 * p);
    relationReturn.style.opacity = String(0.24 + 0.38 * CONFIG.sweepOpacity);

    particles.forEach((particle, index) => {
      if (index >= CONFIG.particleCount) {
        particle.style.opacity = "0";
        return;
      }
      const progress = wrap01(p + index / CONFIG.particleCount);
      const point = relationPath.getPointAtLength(progress * pathLength);
      const pulse = 0.5 + 0.5 * Math.sin(TAU * (progress * 2 + index * 0.17));
      particle.setAttribute("cx", point.x.toFixed(3));
      particle.setAttribute("cy", point.y.toFixed(3));
      particle.setAttribute("r", (3.2 + 2.8 * pulse).toFixed(3));
      const base = CONFIG.particleCount > 6 ? 0.72 : 0.48;
      particle.style.opacity = String(base * (0.45 + 0.55 * pulse));
    });

    const phasePosition = p * moonGlows.length;
    timeAxis.style.strokeDashoffset = String(1 - p);
    timeAxis.style.strokeOpacity = String(0.10 + 0.18 * CONFIG.moonEnergy * (0.5 + 0.5 * wave));
    moonActors.forEach((actor, index) => {
      const glow = moonGlows[index];
      const halo = moonHalos[index];
      const spark = moonSparks[index];
      let distance = Math.abs(phasePosition - index);
      distance = Math.min(distance, moonGlows.length - distance);
      const pulse = smoothPulse(distance);
      const x = Number(actor.dataset.x);
      const y = Number(actor.dataset.y);
      const local = Math.sin(TAU * (p + index * 0.071));
      const orbitAngle = TAU * (p * 2 + index / moonActors.length);
      const orbitRadius = 28 + 4 * pulse;
      actor.setAttribute("transform", `translate(0 ${(2.4 * local).toFixed(3)})`);
      glow.setAttribute("r", (21 + 18 * pulse).toFixed(3));
      glow.style.opacity = String(0.02 + CONFIG.moonEnergy * 0.72 * pulse);
      halo.setAttribute("r", (25 + 5 * pulse).toFixed(3));
      halo.style.strokeDashoffset = String(1 - wrap01(p * 2 + index / moonActors.length));
      halo.style.opacity = String(CONFIG.moonEnergy * (0.05 + 0.56 * pulse));
      spark.setAttribute("cx", (x + orbitRadius * Math.cos(orbitAngle)).toFixed(3));
      spark.setAttribute("cy", (y + orbitRadius * Math.sin(orbitAngle)).toFixed(3));
      spark.setAttribute("r", (1.6 + 2.2 * pulse).toFixed(3));
      spark.style.opacity = String(CONFIG.moonEnergy * (0.04 + 0.80 * pulse));
    });

    betaNodes.forEach((node, index) => {
      const local = Math.sin(TAU * (p + index * 0.083));
      const fadePhase = wrap01(p * CONFIG.betaCycles + index * 0.173);
      const fadeEnvelope = Math.sin(Math.PI * fadePhase) ** 2;
      const softPresence = fadeEnvelope ** 1.65;
      node.setAttribute("transform", `translate(${(8 * local).toFixed(3)} ${(-11 * local).toFixed(3)})`);
      node.style.opacity = String(CONFIG.betaOpacity * (0.035 + 0.965 * softPresence));
      node.style.filter = `blur(${(0.16 + 0.64 * (1 - softPresence)).toFixed(3)}px) drop-shadow(0 0 ${(4 + 13 * softPresence).toFixed(2)}px rgba(94, 126, 255, ${(0.12 + 0.38 * softPresence).toFixed(3)}))`;
    });

    if (CONFIG.cameraMode === "cinematic") {
      energyWave.setAttribute("r", (24 + 250 * breathe).toFixed(3));
      energyWave.style.opacity = String(0.42 * Math.sin(Math.PI * breathe) ** 2);
    } else {
      energyWave.style.opacity = "0";
    }
  }

  function tick(now) {
    if (!playing) return;
    renderAt(pausedElapsed + (now - startedAt) * playbackRate);
    rafId = requestAnimationFrame(tick);
  }

  function setPlaying(next) {
    if (next === playing) return;
    const button = document.querySelector("#toggle-play");
    playing = next;
    if (playing) {
      startedAt = performance.now();
      if (button) button.textContent = "暂停";
      rafId = requestAnimationFrame(tick);
    } else {
      cancelAnimationFrame(rafId);
      pausedElapsed += (performance.now() - startedAt) * playbackRate;
      if (button) button.textContent = "播放";
    }
  }

  function setPlaybackRate(next) {
    const now = performance.now();
    if (playing) {
      pausedElapsed += (now - startedAt) * playbackRate;
      startedAt = now;
    }
    playbackRate = Number(next);
    const value = document.querySelector("#speed-value");
    if (value) value.textContent = `${playbackRate.toFixed(2)}×`;
  }

  if (params.has("controls")) document.body.classList.add("show-controls");
  document.querySelector("#toggle-play")?.addEventListener("click", () => setPlaying(!playing));
  document.querySelector("#speed")?.addEventListener("input", event => setPlaybackRate(event.target.value));

  window.__bstvcBackground = {
    duration: CONFIG.duration,
    variant: CONFIG.code,
    renderAt,
    setPlaying,
    setPlaybackRate,
  };
  window.__p2mReady = false;

  if (seekTime !== null && Number.isFinite(seekTime)) {
    playing = false;
    document.body.classList.add("chromeless");
    renderAt(seekTime);
    requestAnimationFrame(() => requestAnimationFrame(() => { window.__p2mReady = true; }));
  } else if (staticMode || reducedMotion) {
    playing = false;
    document.body.classList.add("chromeless");
    renderAt(0);
    requestAnimationFrame(() => { window.__p2mReady = true; });
  } else {
    renderAt(0);
    rafId = requestAnimationFrame(tick);
    requestAnimationFrame(() => { window.__p2mReady = true; });
  }
})();
</script>
</body>
</html>
