<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BSTVC Logo Motion A · β Variable Link</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #aaa;
      --accent: #e64036;
      --speed-progress: 9%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 1056.3px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: center;
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: 12px/1.2 inherit;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      :root {
        --p2m-duration: 1800ms;
        --p2m-ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
        --p2m-ease-natural: cubic-bezier(0.4, 0, 0.2, 1);
        --p2m-ease-settle: cubic-bezier(0.16, 1, 0.3, 1);
      }

      #logo-frame {
        transform-box: fill-box;
        transform-origin: center;
        animation: p2m-frame var(--p2m-duration) cubic-bezier(0.34, 0, 0.14, 1) both;
      }

      .p2m-mark,
      .p2m-accent {
        transform-box: fill-box;
        transform-origin: center;
        will-change: opacity, transform, filter;
      }

      #sphere-base,
      #sphere-texture {
        opacity: 0;
        animation: p2m-sphere var(--p2m-duration) cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      #sphere-glow {
        opacity: 0;
        animation: p2m-glow var(--p2m-duration) cubic-bezier(0.4, 0, 0.2, 1) both;
      }

      #ribbon-back,
      #ribbon-front,
      #ribbon-loop {
        opacity: 0;
        animation-duration: var(--p2m-duration);
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        animation-fill-mode: both;
      }

      #ribbon-back { animation-name: p2m-ribbon-back; }
      #ribbon-front { animation-name: p2m-ribbon-front; }
      #ribbon-loop { animation-name: p2m-ribbon-loop; }

      .p2m-moon,
      .p2m-texture {
        opacity: 0;
        animation-duration: var(--p2m-duration);
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        animation-fill-mode: both;
      }

      #accent-moon-1, #accent-texture-1 { animation-name: p2m-accent-1; }
      #accent-moon-2, #accent-texture-2 { animation-name: p2m-accent-2; }
      #accent-moon-3, #accent-texture-3 { animation-name: p2m-accent-3; }
      #accent-moon-4, #accent-texture-4 { animation-name: p2m-accent-4; }
      #accent-moon-5, #accent-texture-5 { animation-name: p2m-accent-5; }
      #accent-moon-6, #accent-texture-6 { animation-name: p2m-accent-6; }

      @keyframes p2m-frame {
        0%   { opacity: 0; transform: translateY(18px) scale(0.985); }
        20%  { opacity: 0.18; transform: translateY(13px) scale(0.987); }
        60%  { opacity: 1; transform: translateY(-2px) scale(1.008); }
        80%  { opacity: 1; transform: translateY(1px) scale(0.998); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes p2m-sphere {
        0%, 10% { opacity: 0; transform: scale(0.94); filter: blur(8px); }
        36%  { opacity: 0.35; transform: scale(0.97); filter: blur(4px); }
        66%  { opacity: 1; transform: scale(1.01); filter: blur(0); }
        100% { opacity: 1; transform: scale(1); filter: blur(0); }
      }

      @keyframes p2m-glow {
        0%, 24% { opacity: 0; transform: scale(0.8); }
        60%  { opacity: 0.35; transform: scale(1.06); }
        84%  { opacity: 0.16; transform: scale(1); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes p2m-ribbon-back {
        0%, 14% { opacity: 0; transform: translateY(18px) translateX(-12px) scale(0.97); }
        35%  { opacity: 0.2; transform: translateY(11px) translateX(-8px) scale(0.98); }
        72%  { opacity: 1; transform: translateY(-2px) translateX(2px) scale(1.008); }
        88%  { opacity: 1; transform: translateY(1px) translateX(-1px) scale(0.999); }
        100% { opacity: 1; transform: translateY(0) translateX(0) scale(1); }
      }

      @keyframes p2m-ribbon-front {
        0%, 22% { opacity: 0; transform: translateY(18px) translateX(-12px) scale(0.97); }
        43%  { opacity: 0.2; transform: translateY(11px) translateX(-8px) scale(0.98); }
        78%  { opacity: 1; transform: translateY(-2px) translateX(2px) scale(1.008); }
        91%  { opacity: 1; transform: translateY(1px) translateX(-1px) scale(0.999); }
        100% { opacity: 1; transform: translateY(0) translateX(0) scale(1); }
      }

      @keyframes p2m-ribbon-loop {
        0%, 30% { opacity: 0; transform: translateY(18px) translateX(-12px) scale(0.97); }
        51%  { opacity: 0.2; transform: translateY(11px) translateX(-8px) scale(0.98); }
        84%  { opacity: 1; transform: translateY(-2px) translateX(2px) scale(1.008); }
        94%  { opacity: 1; transform: translateY(1px) translateX(-1px) scale(0.999); }
        100% { opacity: 1; transform: translateY(0) translateX(0) scale(1); }
      }

      @keyframes p2m-accent-1 {
        0%, 40% { opacity: 0; transform: translateX(22px) translateY(8px) scale(0.75); }
        66%  { opacity: 1; transform: translateX(-2px) translateY(-2px) scale(1.05); }
        84%  { opacity: 1; transform: translateX(1px) translateY(1px) scale(0.99); }
        100% { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
      }

      @keyframes p2m-accent-2 {
        0%, 44% { opacity: 0; transform: translateX(22px) translateY(8px) scale(0.75); }
        70%  { opacity: 1; transform: translateX(-2px) translateY(-2px) scale(1.05); }
        86%  { opacity: 1; transform: translateX(1px) translateY(1px) scale(0.99); }
        100% { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
      }

      @keyframes p2m-accent-3 {
        0%, 48% { opacity: 0; transform: translateX(22px) translateY(8px) scale(0.75); }
        74%  { opacity: 1; transform: translateX(-2px) translateY(-2px) scale(1.05); }
        88%  { opacity: 1; transform: translateX(1px) translateY(1px) scale(0.99); }
        100% { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
      }

      @keyframes p2m-accent-4 {
        0%, 52% { opacity: 0; transform: translateX(22px) translateY(8px) scale(0.75); }
        78%  { opacity: 1; transform: translateX(-2px) translateY(-2px) scale(1.05); }
        90%  { opacity: 1; transform: translateX(1px) translateY(1px) scale(0.99); }
        100% { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
      }

      @keyframes p2m-accent-5 {
        0%, 56% { opacity: 0; transform: translateX(22px) translateY(8px) scale(0.75); }
        82%  { opacity: 1; transform: translateX(-2px) translateY(-2px) scale(1.05); }
        92%  { opacity: 1; transform: translateX(1px) translateY(1px) scale(0.99); }
        100% { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
      }

      @keyframes p2m-accent-6 {
        0%, 60% { opacity: 0; transform: translateX(22px) translateY(8px) scale(0.75); }
        86%  { opacity: 1; transform: translateX(-2px) translateY(-2px) scale(1.05); }
        94%  { opacity: 1; transform: translateX(1px) translateY(1px) scale(0.99); }
        100% { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
      }

      /* Atomic studies reuse the same semantic classes and final geometry. */
      .atom-stage img:hover { filter: drop-shadow(0 0 10px rgba(65, 176, 246, 0.45)); }
    }
  </style>
<style id="concept-style-A">
body { background: #02050d; }
#logo-root { position: relative; width: min(82vw, 860px); }
#logo-root svg { overflow: visible; }
.concept-layer { pointer-events: none; }
.concept-layer path, .concept-layer ellipse, .concept-layer circle { vector-effect: non-scaling-stroke; }
@media (prefers-reduced-motion: reduce) {
  .concept-layer { opacity: .9; }
}

.concept-layer .beta-silk-base { fill: none; stroke: url(#conceptBetaGradient); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: .18; }
.concept-layer .beta-silk-glow { fill: none; stroke: #52eaff; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; opacity: .14; filter: blur(10px); }
.concept-layer .beta-silk-trail { fill: none; stroke: url(#conceptBetaGradient); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; opacity: .9; filter: drop-shadow(0 0 9px rgba(61,220,255,.8)); }
.concept-layer .beta-silk-tip { fill: #ffffff; opacity: .95; filter: drop-shadow(0 0 11px rgba(187,252,255,1)); }
.concept-layer .beta-silk-node { fill: #d8ffff; opacity: .72; filter: drop-shadow(0 0 7px rgba(103,240,255,.8)); }
.concept-layer .beta-lockup-v2 path { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; filter: drop-shadow(0 0 11px rgba(255,255,255,.95)); }
#concept-layer-A .beta-sweep, #concept-layer-A .beta-sweep-glow, #concept-layer-A .beta-lockup { display: none !important; }
#concept-layer-A .beta-silk-base path { stroke-width: 2.2; opacity: .12; }
#concept-layer-A .beta-silk-glow path { stroke-width: 14; opacity: .09; filter: blur(7px); }
#concept-layer-A .beta-silk-trail path { stroke-width: 6; opacity: .78; }
#concept-layer-A .a-occluded-thin path { fill: none; stroke: url(#conceptBetaGradient); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: .24; filter: blur(.3px); mask: url(#conceptAOcclusionThin); }

#concept-layer-A .beta-sweep path { fill: none; stroke: url(#conceptAGradient); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .78; filter: drop-shadow(0 0 8px rgba(61,220,255,.75)); }
#concept-layer-A .beta-sweep-glow path { fill: none; stroke: #36e9ff; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; opacity: .13; filter: blur(9px); }
#concept-layer-A .beta-lockup path { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; filter: drop-shadow(0 0 12px rgba(255,255,255,.95)); }
</style>
<style id="bstvc-main-logo-only">
  html, body { min-height: 100%; width: 100%; overflow: hidden; background: #02050d; }
  body { padding: 0; gap: 0; justify-content: center; }
  #logo-root { width: min(94vw, 860px); max-height: 100%; }
  #logo-root svg { max-height: 100%; }
  .atomic-motions, .principles, .controls, body > .footer { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    #logo-root svg * { animation-iteration-count: infinite; }
  }
</style>

<body>
  <main id="logo-root" aria-label="Animated logo" data-p2m-duration="1800"></main>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <div class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">Hover</span></div>
    <div class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">Pulse</span></div>
    <div class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">Arc</span></div>
    <div class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">Press</span></div>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="squashstretch">Squash &amp; stretch</span>
    <span class="pill" data-p="anticipation">Anticipation</span>
    <span class="pill" data-p="staging">Staging</span>
    <span class="pill" data-p="followthrough">Follow through</span>
    <span class="pill" data-p="overlap">Overlapping</span>
    <span class="pill" data-p="slowinout">Slow in / out</span>
    <span class="pill" data-p="arc">Arc</span>
    <span class="pill" data-p="secondary">Secondary action</span>
    <span class="pill" data-p="timing">Timing</span>
    <span class="pill" data-p="appeal">Appeal</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">Replay</button>
    <button id="btnSlow" type="button">Slow motion</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">Speed</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="0.45" aria-label="Animation speed">
      <span class="speed-value" id="speedValue">0.45x</span>
    </label>
  </div>

  <p class="footer">Click the main logo to replay | Drag speed | Try atomic motions</p>

const aOccludedThinPaths = [...document.querySelectorAll("#concept-layer-A .a-occluded-thin path")];
const aOccludedThinLengths = aOccludedThinPaths.map((path) => path.getTotalLength());
aOccludedThinPaths.forEach((path, i) => { path.style.strokeDasharray = `${aOccludedThinLengths[i] * .16} ${aOccludedThinLengths[i] * .84}`; });
const betaSweepA = [...document.querySelectorAll("#concept-layer-A .beta-sweep path")];
const betaGlowA = [...document.querySelectorAll("#concept-layer-A .beta-sweep-glow path")];
const betaLockupA = [...document.querySelectorAll("#concept-layer-A .beta-lockup path")];
const betaLengthsA = betaSweepA.map((path) => path.getTotalLength());
betaSweepA.forEach((path, i) => { path.style.strokeDasharray = `${betaLengthsA[i] * .16} ${betaLengthsA[i] * .84}`; });
betaGlowA.forEach((path, i) => { path.style.strokeDasharray = `${betaLengthsA[i] * .22} ${betaLengthsA[i] * .78}`; });
function clamp01(value) { return Math.max(0, Math.min(1, value)); }
function easeOutCubic(value) { const t = clamp01(value); return 1 - Math.pow(1 - t, 3); }
function drawConceptA(progress) {
  const sharedTravel = window.__bstvcBetaTravel ?? progress;
  aOccludedThinPaths.forEach((path, i) => {
    const local = (sharedTravel + i * .04) % 1;
    path.style.strokeDashoffset = String(-local * aOccludedThinLengths[i]);
  });
  const sweep = progress * (betaSweepA.length + .18);
  betaSweepA.forEach((path, i) => {
    const local = clamp01(sweep - i);
    path.style.strokeDashoffset = `${-easeOutCubic(local) * betaLengthsA[i]}`;
    path.style.opacity = String(.14 + .64 * local);
  });
  betaGlowA.forEach((path, i) => {
    const local = clamp01(sweep - i);
    path.style.strokeDashoffset = `${-easeOutCubic(local) * betaLengthsA[i]}`;
    path.style.opacity = String(.03 + .16 * local);
  });
  const lockup = easeOutCubic((progress - .70) / .30);
  betaLockupA.forEach((path) => { path.style.opacity = String(.08 + .82 * lockup); });
}

  const duration = 7600;
  const params = new URLSearchParams(location.search);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const seek = params.get("t");
  const staticMode = params.has("static");
  let start = performance.now();
  function tick(now) {
    let progress;
    if (staticMode || reduced) {
      layer.style.display = "none";
      return;
    }
    layer.style.display = "";
    if (seek !== null) {
      const raw = Number(seek);
      progress = raw === duration ? 1 : (((raw % duration) + duration) % duration) / duration;
    } else progress = ((now - start) % duration) / duration;
    drawBetaSilk(progress, "A");
    drawConceptA(progress);
    if (!staticMode && !reduced && seek === null) requestAnimationFrame(tick);
  }
  tick(performance.now());
})();
